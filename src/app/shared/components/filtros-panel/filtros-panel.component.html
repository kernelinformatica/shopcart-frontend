<div class="card shadow-sm filtros-card small" [class.filtros-card-plegado]="filtrosColapsados">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h6 class="mb-0 fw-bold">Filtros</h6>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link btn-sm p-0" type="button" (click)="limpiarFiltros.emit()" [disabled]="!hayFiltrosActivos" title="Limpiar filtros" aria-label="Limpiar filtros">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="toggleFiltrosColapsados.emit()" title="Plegar filtros" aria-label="Plegar filtros">
          <i class="bi bi-chevron-bar-left"></i>
        </button>
      </div>
    </div>
    <div class="mb-2">
      <input type="text" class="form-control form-control-sm mb-2" placeholder="Buscar por nombre o descripción" [value]="filtroNombre" (input)="onFiltroNombreInput($any($event.target).value)">
    </div>
    <div class="mb-2">
      <label class="form-label fw-semibold mb-1">Precio mínimo</label>
      <input type="number" class="form-control form-control-sm" min="0" [value]="precioMinFiltro ?? ''" (input)="onPrecioMinInput($any($event.target).value)" placeholder="Ej: 1000">
    </div>
    <div class="mb-2">
      <label class="form-label fw-semibold mb-1">Precio máximo</label>
      <input type="number" class="form-control form-control-sm" min="0" [value]="precioMaxFiltro ?? ''" (input)="onPrecioMaxInput($any($event.target).value)" placeholder="Ej: 5000">
    </div>
    <div class="mb-2">
      <label class="form-label fw-semibold mb-1">Marca</label>
      <div *ngFor="let marca of marcasDisponibles ?? []">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [id]="'marca-' + marca" [checked]="marcasSeleccionadas[marca]" (change)="onMarcaChange(marca, $any($event.target).checked)">
          <label class="form-check-label" [for]="'marca-' + marca">{{ marca }}</label>
        </div>
      </div>
    </div>
    <div class="mb-2">
      <label class="form-label fw-semibold mb-1">Categoría</label>
      <div *ngFor="let categoria of categoriasDisponibles ?? []">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [id]="'categoria-' + categoria" [checked]="categoriasSeleccionadas[categoria]" (change)="onCategoriaChange(categoria, $any($event.target).checked)">
          <label class="form-check-label" [for]="'categoria-' + categoria">{{ categoria }}</label>
        </div>
      </div>
    </div>
  </div>
</div>
