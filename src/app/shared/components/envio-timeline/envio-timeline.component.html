<div class="envio-timeline" *ngIf="pedido?.pedidoEnvio as env; else sinEnvio">
  <div *ngIf="etiquetaDemorado" class="alert alert-warning py-1 px-2 small mb-2 d-inline-flex align-items-center gap-1">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ etiquetaDemorado }}</span>
  </div>

  <div class="timeline-track">
    <div class="timeline-line"></div>
    <div class="timeline-truck" [style.top.%]="camionPosicionPct" aria-hidden="true">
      <i class="bi bi-truck"></i>
    </div>

    <ul class="timeline-nodos list-unstyled m-0">
      <li *ngFor="let n of nodos; let last = last" class="timeline-nodo" [attr.data-estado]="n.estado">
        <div class="nodo-dot">
          <i *ngIf="n.estado === 'completado'" class="bi bi-check-lg"></i>
          <i *ngIf="n.estado === 'activo'" class="bi bi-truck"></i>
          <i *ngIf="n.estado === 'demorado'" class="bi bi-exclamation-lg"></i>
          <i *ngIf="n.estado === 'cancelado'" class="bi bi-x-lg"></i>
        </div>
        <div class="nodo-contenido">
          <div class="nodo-label">{{ n.label }}</div>
          <div *ngIf="n.timestamp" class="nodo-timestamp text-muted small">{{ n.timestamp }}</div>
          <div *ngIf="n.estado === 'demorado'" class="text-warning small fw-bold">Demorado</div>
          <div *ngIf="n.estado === 'cancelado'" class="text-danger small fw-bold">Cancelado</div>
        </div>
      </li>
    </ul>
  </div>

  <div *ngIf="ventanaEntregaTexto" class="timeline-eta mt-2 small text-muted">
    <i class="bi bi-clock me-1"></i> {{ ventanaEntregaTexto }}
  </div>
</div>

<ng-template #sinEnvio>
  <div class="text-muted small">
    <i class="bi bi-info-circle me-1"></i> Este pedido aún no tiene envío asociado.
  </div>
</ng-template>
