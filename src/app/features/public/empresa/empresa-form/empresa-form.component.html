<p>empresa-form works!</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="p-4 border rounded bg-light">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input class="form-control" formControlName="nombre" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <textarea class="form-control" formControlName="descripcion"></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Dirección</label>
    <input class="form-control" formControlName="direccion" />
  </div>
  <div class="mb-3">
    <label class="form-label">Teléfono</label>
    <input class="form-control" formControlName="telefono" />
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" formControlName="email" />
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading">Guardar</button>
  <div *ngIf="error" class="alert alert-danger mt-2">{{ error | escapeCurlyBraces }}</div>
</form>
