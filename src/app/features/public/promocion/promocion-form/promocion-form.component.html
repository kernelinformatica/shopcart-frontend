<form *ngIf="form" [formGroup]="form" (ngSubmit)="submit()" class="p-4 border rounded bg-light">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input class="form-control" formControlName="nombre" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <textarea class="form-control" formControlName="descripcion"></textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Descuento (%)</label>
    <input type="number" class="form-control" formControlName="descuentoPorcentaje" />
  </div>
  <div class="mb-3">
    <label class="form-label">Descuento Fijo</label>
    <input type="number" class="form-control" formControlName="descuentoFijo" />
  </div>
  <div class="mb-3">
    <label class="form-label">Productos</label>
    <input class="form-control" formControlName="productoIds" />
  </div>
  <div class="mb-3">
    <label class="form-label">Rubros</label>
    <input class="form-control" formControlName="rubroIds" />
  </div>
  <div class="mb-3">
    <label class="form-label">Empresas</label>
    <input class="form-control" formControlName="empresaIds" />
  </div>
  <div class="mb-3">
    <label class="form-label">Activa</label>
    <input type="checkbox" class="form-check-input" formControlName="activa" />
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="form.invalid || loading">Guardar</button>
  <div *ngIf="error" class="alert alert-danger mt-2">{{ error | escapeCurlyBraces }}</div>
</form>
