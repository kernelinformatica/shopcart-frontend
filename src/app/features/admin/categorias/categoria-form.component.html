<form [formGroup]="form" (ngSubmit)="onGuardar()" class="categoria-form">
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input id="nombre" formControlName="nombre" class="form-control" required>
  </div>
  <div class="mb-3">
    <label for="codInterno" class="form-label">Cod. Interno</label>
    <input id="codInterno" formControlName="codInterno" class="form-control" placeholder="Opcional" type="number" min="0" step="1">
  </div>
  <div class="mb-3">
    <label for="descripcion" class="form-label">Descripción</label>
    <textarea id="descripcion" formControlName="descripcion" class="form-control"></textarea>
  </div>
  <div class="mb-3">
    <label for="imagen" class="form-label">Imagen (URL)</label>
    <input id="imagen" formControlName="imagen" class="form-control">
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-success" [disabled]="form.invalid">Guardar</button>
    <button type="button" class="btn btn-secondary" (click)="onCancelar()">Cancelar</button>
    <button  type="button" class="btn btn-danger ms-auto" (click)="onEliminar()">Eliminar</button>
  </div>
</form>
